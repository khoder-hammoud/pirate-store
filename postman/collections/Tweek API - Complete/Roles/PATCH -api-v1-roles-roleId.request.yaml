$kind: http-request
name: PATCH /api/v1/roles/:roleId
url: "{{api_base}}/roles/{{role_id}}"
method: PATCH
headers:
  Authorization: Bearer {{access_token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Senior Cashier",
      "permissions": [
        "sale.view",
        "sale.create",
        "inventory.view",
        "inventory.adjust"
      ]
    }
order: 3000
