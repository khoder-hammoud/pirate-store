$kind: http-request
name: POST /api/v1/auth/login
url: "{{api_base}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{owner_email}}",
      "password": "{{owner_password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json && json.success && json.data && json.data.accessToken) {
        pm.collectionVariables.set('access_token', json.data.accessToken);
        if (json.data.profile && json.data.profile.business) {
          pm.collectionVariables.set('business_id', json.data.profile.business.id || '');
        }
        if (json.data.profile && json.data.profile.branch) {
          pm.collectionVariables.set('branch_id', json.data.profile.branch.id || '');
        }
      }
      pm.test('Login succeeded', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 1000
