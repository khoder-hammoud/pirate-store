method: POST
headers:
  Authorization: Bearer {{access_token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Hot Drinks",
      "description": "Coffee and tea",
      "sortOrder": 1
    }
order: 2000
