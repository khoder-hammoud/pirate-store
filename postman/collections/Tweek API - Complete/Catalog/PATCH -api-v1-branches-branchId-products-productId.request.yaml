$kind: http-request
name: PATCH /api/v1/branches/:branchId/products/:productId
url: "{{api_base}}/branches/{{branch_id}}/products/{{product_id}}"
method: PATCH
headers:
  Authorization: Bearer {{access_token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "priceOverride": "22.00",
      "isAvailable": true,
      "isFeatured": true,
      "sortOrder": 1
    }
order: 6000
