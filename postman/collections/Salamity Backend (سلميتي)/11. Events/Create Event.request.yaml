$kind: http-request
url: "{{baseUrl}}/events"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "مهرجان سلمية الثقافي",
      "subtitle": "فعاليات فنية وثقافية على مدار أسبوع",
      "imagePath": "/uploads/event-example.jpg",
      "isBookable": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 2xx', function () {
          pm.response.to.be.success;
      });
      pm.test('Response has success:true envelope', function () {
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
      });
      const json = pm.response.json();
      if (json.success) { pm.collectionVariables.set('eventId', json.data.id); }
    language: text/javascript
order: 2000
