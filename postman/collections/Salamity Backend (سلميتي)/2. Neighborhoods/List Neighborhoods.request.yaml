$kind: http-request
description: Public. Run this before "Create Neighborhood" — if a neighborhood already exists (e.g. from a previous run), this reuses it and Create can safely fail on the @unique name without breaking the chain.
url: "{{baseUrl}}/neighborhoods"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 2xx', function () {
          pm.response.to.be.success;
      });
      pm.test('Response has success:true envelope', function () {
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
      });
      const json = pm.response.json();
      if (Array.isArray(json.data) && json.data.length > 0) {
          pm.collectionVariables.set('neighborhoodId', json.data[0].id);
      }
    language: text/javascript
order: 1000
