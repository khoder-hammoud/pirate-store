$kind: http-request
description: Basic liveness check — no auth required.
url: "{{baseUrl}}/health"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 1000
