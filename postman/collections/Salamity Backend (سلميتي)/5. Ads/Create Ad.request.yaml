$kind: http-request
url: "{{baseUrl}}/ads"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "شقة للإيجار بمركز سلمية",
      "description": "شقة ثلاث غرف وصالون، طابق ثاني، قريبة من السوق",
      "price": "250000",
      "phoneNumber": "963944123456",
      "imagePaths": []
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 2xx', function () {
          pm.response.to.be.success;
      });
      pm.test('Response has success:true envelope', function () {
          const json = pm.response.json();
          pm.expect(json.success).to.eql(true);
      });
      const json = pm.response.json();
      if (json.success) { pm.collectionVariables.set('adId', json.data.id); }
    language: text/javascript
order: 2000
