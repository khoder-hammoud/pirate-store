$kind: http-request
url: "{{baseUrl}}/api/refunds/orders/{{orderId}}"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{userToken}}
body:
  type: text
  content: |-
    {
      "amount": 5.00
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Refund initiated or accepted', function(){ pm.expect(pm.response.code).to.be.oneOf([200,201]); });
      try { var body = pm.response.json(); var id = body.refund && body.refund._id ? body.refund._id : body._id; if (id) pm.environment.set('refundId', id); } catch(e) {}
    language: text/javascript
order: 1000
